# SDL-2 leaderboard world board-012. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key d6586a319d20e22d); the agent never sees them.
[task]
name = "sdl2/board-012"
world_key = "d6586a319d20e22d"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-012 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-012/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
