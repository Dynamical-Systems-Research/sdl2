# SDL-2 leaderboard world board-029. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 38ab58c34547395b); the agent never sees them.
[task]
name = "sdl2/board-029"
world_key = "38ab58c34547395b"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-029 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-029/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
