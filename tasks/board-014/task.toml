# SDL-2 leaderboard world board-014. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 12e960b72e74e953); the agent never sees them.
[task]
name = "sdl2/board-014"
world_key = "12e960b72e74e953"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-014 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-014/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
