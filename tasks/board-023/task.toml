# SDL-2 leaderboard world board-023. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key e340d66f76db0c47); the agent never sees them.
[task]
name = "sdl2/board-023"
world_key = "e340d66f76db0c47"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-023 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-023/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
