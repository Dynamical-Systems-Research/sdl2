# SDL-2 leaderboard world board-022. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 105397c9d6f4c3fa); the agent never sees them.
[task]
name = "sdl2/board-022"
world_key = "105397c9d6f4c3fa"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-022 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-022/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
