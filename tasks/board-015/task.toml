# SDL-2 leaderboard world board-015. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key cc4b7767e121962d); the agent never sees them.
[task]
name = "sdl2/board-015"
world_key = "cc4b7767e121962d"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-015 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-015/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
