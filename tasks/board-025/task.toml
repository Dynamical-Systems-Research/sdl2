# SDL-2 leaderboard world board-025. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 29ef15b5f9531cbc); the agent never sees them.
[task]
name = "sdl2/board-025"
world_key = "29ef15b5f9531cbc"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-025 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-025/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
