# SDL-2 leaderboard world board-011. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key b9bae8d2b2ba5bbf); the agent never sees them.
[task]
name = "sdl2/board-011"
world_key = "b9bae8d2b2ba5bbf"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-011 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-011/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
