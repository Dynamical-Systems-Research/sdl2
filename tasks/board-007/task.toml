# SDL-2 leaderboard world board-007. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key be2d1f877bb6631d); the agent never sees them.
[task]
name = "sdl2/board-007"
world_key = "be2d1f877bb6631d"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-007 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-007/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
