# SDL-2 leaderboard world board-030. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key f18afd80b5f1805d); the agent never sees them.
[task]
name = "sdl2/board-030"
world_key = "f18afd80b5f1805d"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-030 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-030/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
