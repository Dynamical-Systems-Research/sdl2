# SDL-2 leaderboard world board-009. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 69fc514962aa143c); the agent never sees them.
[task]
name = "sdl2/board-009"
world_key = "69fc514962aa143c"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-009 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-009/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
