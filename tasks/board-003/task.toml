# SDL-2 leaderboard world board-003. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key f9b5b14ac27945ee); the agent never sees them.
[task]
name = "sdl2/board-003"
world_key = "f9b5b14ac27945ee"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-003 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-003/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
