# SDL-2 leaderboard world board-027. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 7ac0f2cec31b75f3); the agent never sees them.
[task]
name = "sdl2/board-027"
world_key = "7ac0f2cec31b75f3"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-027 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-027/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
