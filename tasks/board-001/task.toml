# SDL-2 leaderboard world board-001. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key ed7de360b8b372fc); the agent never sees them.
[task]
name = "sdl2/board-001"
world_key = "ed7de360b8b372fc"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-001 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-001/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
