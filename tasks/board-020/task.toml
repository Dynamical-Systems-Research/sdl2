# SDL-2 leaderboard world board-020. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 35aa70a385236a1d); the agent never sees them.
[task]
name = "sdl2/board-020"
world_key = "35aa70a385236a1d"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-020 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-020/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
