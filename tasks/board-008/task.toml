# SDL-2 leaderboard world board-008. The world record, its hidden parameters and the true outcome of every route are in
# the dataset under worlds/ (key 99e0fb37f0c78844); the agent never sees them.
[task]
name = "sdl2/board-008"
world_key = "99e0fb37f0c78844"
instruction = "instruction.md"   # the SDL-2 contract, identical for every world; the run adds this world's reference body

[run]
# harness/setup.sh ROOT DATA once, then:
command = "harness/run.sh ROOT EPISODES <episode-name> board-008 <bo|doe|openrouter-model-id>"

[verifier]
command = "tasks/board-008/tests/test.sh DATA EPISODES/<episode-name>"
metrics = ["outcome", "supported", "both"]
